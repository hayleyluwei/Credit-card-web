# T22 排程輔助資料更新（瘦身版）：每月自動檢查各家銀行官網來源頁是否有變動
# 任務卡：docs/implementation/tasks/T22-SCHEDULED_DATA_UPDATE_排程輔助資料更新.md
#
# ⚠️ 本 workflow 全程唯讀：只讀資料庫與外部網頁，不寫入任何資料。
#    依 Scope v2，DATABASE_URL 必須使用「唯讀」連線字串，不得放入具寫入權限的憑證。

name: 每月優惠來源檢查

on:
  schedule:
    # 每月 1 日 01:00 UTC（台北時間 09:00）執行。
    - cron: "0 1 1 * *"
  # 允許手動觸發，方便設定完 Secrets 後立刻試跑一次。
  workflow_dispatch:

# 僅需讀取程式碼，不授予寫入權限。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium

      - name: 執行來源檢查
        env:
          # 唯讀連線字串。若此處誤用具寫入權限的憑證，即違反 Scope v2 的唯讀限制。
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run t22:check
